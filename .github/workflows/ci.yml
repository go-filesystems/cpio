name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # What the synthetic-archive and flag tests reach.
  #
  # The paths that drive a REAL decoder -- opening an actual archive, following
  # an actual volume set -- are not exercised here: what they are FOR is a
  # multi-volume set, and a binary fixture of one is a thing this repository
  # does not carry. A live proof belongs with a real set, not with a fixture
  # nobody can read.
  COVERAGE_MIN: "65.0"

jobs:
  native:
    name: native ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          check-latest: true
          cache: true

      - name: Gofmt
        run: |
          out=$(gofmt -l .)
          [ -z "$out" ] || { echo "not gofmt'd:"; echo "$out"; exit 1; }

      - name: Vet
        run: go vet ./...

      # ⛔ THE ONE FOREIGN JUDGE IN THIS REPOSITORY HAS NEVER RUN.
      # TestBinAndPwbAreTheSameFormatHere skips itself when cpio(1) is not on
      # PATH, and this CI never installed it — so the assertion its own comment
      # calls out ("a cpio(1) that started distinguishing them would otherwise
      # be discovered by a user rather than here") has been discovering nothing
      # since the test was written. A green lane over a skipped judge looks
      # exactly like a green lane over a passing one.
      #
      # It has to be LIBARCHIVE's cpio. The runners carry GNU cpio, which has
      # no `pwb` format — `cpio -H pwb` exits 2 — so with it the test skipped
      # twice over and asserted nothing. Measured on the runner in this very
      # pull request before the package was changed.
      #
      # Found by go-fleettools/judgescan, which reads which tools the tests
      # reach for and which ones the workflows install.
      - name: Install the foreign judge
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libarchive-tools

      - name: Test (race + coverage)
        run: go test -race -covermode=atomic -coverprofile=cover.out -timeout 5m ./...

      # A skip is not a pass, and the difference is invisible in the summary
      # line. If the judge stops being installed, or the test starts skipping
      # for some other reason, this says so instead of going quietly green.
      - name: The judge must have judged
        run: |
          set -euo pipefail
          out=$(go test -run TestBinAndPwbAreTheSameFormatHere -v . 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          case "$out" in
            *"--- SKIP"*) echo "::error::the cpio(1) comparison skipped; the judge is not installed"; exit 1 ;;
            *"--- PASS"*) ;;
            *) echo "::error::the cpio(1) comparison neither passed nor skipped"; exit 1 ;;
          esac

      - name: Enforce coverage floor
        run: |
          set -euo pipefail
          total=$(go tool cover -func=cover.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "total coverage: ${total}% (floor ${COVERAGE_MIN}%)"
          awk -v c="$total" -v m="$COVERAGE_MIN" 'BEGIN { exit (c+0 >= m+0) ? 0 : 1 }' \
            || { echo "coverage ${total}% below floor ${COVERAGE_MIN}%"; exit 1; }

  # Every 64-bit target the fleet ships for, CGO-free. A driver that reads a
  # byte order wrong shows up here and nowhere else: s390x is big-endian.
  cross:
    name: cross ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: riscv64 }
          - { goos: linux, goarch: loong64 }
          - { goos: linux, goarch: ppc64le }
          - { goos: linux, goarch: s390x }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: js, goarch: wasm }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          check-latest: true
          cache: true
      - name: Build
        run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./...
      - name: Vet
        run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go vet ./...
